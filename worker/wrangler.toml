name = "refrigerant-log-mts"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "refrigerant-log-mts"
database_id = "62b5a6e9-8fb8-446d-b384-d9956bb5b473"
migrations_dir = "migrations"

[triggers]
# 9am UTC on the 28th of every month — reminds technicians to log entries
# before the month closes out. Not "last day" because cron has no such
# wildcard; the 28th exists in every month and leaves a few days' buffer.
crons = ["0 9 28 * *"]

[vars]
# Used to build the login link in reminder emails. Update if you set up a
# custom domain instead of the default *.workers.dev URL.
APP_URL = "https://refrigerant-log-mts.lukedorsett.workers.dev"
