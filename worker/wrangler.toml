name = "refrigerant-log-mts"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "refrigerant-log-mts"
database_id = "62b5a6e9-8fb8-446d-b384-d9956bb5b473"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "refrigerant-log-mts-backups"

[triggers]
# Fires daily at 9am UTC. The scheduled handler always runs a database
# backup to R2, and separately checks the admin-configured reminder day
# (Admin -> Settings, default 28th), only actually sending reminder emails
# on a match — cron has no "specific day, admin-configurable" wildcard, so
# that day-matching logic lives in code instead of here.
crons = ["0 9 * * *"]

[vars]
# Used to build the login link in reminder emails. Update if you set up a
# custom domain instead of the default *.workers.dev URL.
APP_URL = "https://refrigerant-log-mts.lukedorsett.workers.dev"
