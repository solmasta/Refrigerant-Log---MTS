services:
  - type: web
    name: refrigerant-log-mts
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/db.json
    disk:
      name: refrigerant-log-data
      mountPath: /var/data
      sizeGB: 1
